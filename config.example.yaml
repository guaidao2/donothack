# donothack 示例配置
#
# 结构与 docs/DESIGN.md 附录 B 一一对应。未知字段会导致启动失败（这是刻意的：
# "写了但没生效"是最难查的一类故障）。
#
# 与档位相关的上限（max_conns、max_inspect_body、max_rules、ring_buffer_size、
# ratelimit_table_capacity、max_prefilter_literals、max_idle_conns_per_host）
# 不在这里写死：它们由 profile 决定，显式写了才以你写的为准。

# small = 1 vCPU / 512 MiB，medium = 2 vCPU / 2 GiB（目标档），large = 4+ vCPU / 8 GiB+
# auto = 按 cgroup v2 → cgroup v1 → /proc/meminfo 与 NumCPU 自动探测
profile: auto

listen:
  addr: "0.0.0.0:8080"
  max_header_bytes: 32KiB        # net/http 默认 1MiB，低配下是内存放大点
  read_header_timeout: 5s        # 防 slowloris
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s          # 优雅停机的 drain 上限
  http2: false                   # 明文站用不上；启用 TLS 时再开
  health_path: /healthz
  ready_path: /readyz

upstream:
  url: "http://127.0.0.1:9000"
  dial_timeout: 5s
  response_header_timeout: 30s
  idle_conn_timeout: 30s
  tcp_nodelay: true
  preserve_host: false           # true = 保留客户端 Host 头

# 数据面 TLS 默认关（站点可能就跑明文 HTTP）
tls:
  enabled: false
  cert_file: ""
  key_file: ""
  min_version: "1.2"

# 真实客户端 IP。**留空时忽略所有 X-Forwarded-For，直接用连接对端地址。**
# 明文站前面若有 nginx / CDN，这里必须填对，否则限速与封禁形同虚设。
real_ip:
  trusted_proxies: []
  header: "X-Forwarded-For"

engine:
  mode: detect                   # detect（只记录）| block | mixed
  fail_mode: open                # open（出错放行，保业务）| closed
  degrade: auto                  # auto | off；block 模式下只允许 L1，L2+ 返回 503
  inbound_anomaly_threshold: 5

rules:
  dir: "./rules"
  files: ["*.yaml"]
  reload_interval: 0s            # 0 = 只靠 SIGHUP 或控制面 API 触发
  self_test: true                # 加载前跑内置正负语料，不过就整批拒绝

# 只写需要偏离档位默认值的项
limits:
  max_uri_length: 8192
  max_headers: 100
  max_params: 1000
  max_param_value_len: 64KiB
  max_json_depth: 32
  max_json_nodes: 10000
  max_transform_depth: 8

ratelimit:
  enabled: true
  default_rps: 100
  default_burst: 200
  ban_after_hits: 20
  ban_window: 60s
  ban_duration: 300s
  whitelist: []

log:
  level: info                    # debug | info | warn | error
  format: json                   # json | text
  output: stdout                 # 访问/审计日志去向：stdout（交 journald）| file
  file: "./logs/donothack.jsonl"
  app_output: stderr             # 应用日志去向：stderr | stdout | file
  app_file: "./logs/donothack-app.log"

  # 轮转与保留 —— 这几项决定"日志会不会把磁盘写满"。
  # 实测 29k rps 全量记录约 22 MB/s，没有上限的话 20GB 磁盘十几分钟就满，
  # 而写满之后是"WAF 静默失能"（最糟的失败模式）。
  max_size_mb: 100               # 单文件多大就轮转
  max_backups: 10                # 最多留几份轮转文件
  total_max_mb: 512              # 日志目录总配额，超了删最旧的（硬顶，优先于 max_backups）
  min_free_mb: 1024              # 磁盘剩余低于此值就丢弃日志并计数，绝不把盘写满
  compress: true                 # 轮转后 gzip 旧文件（异步，压不过来就跳过、不阻塞写）

  # 访问日志策略
  #   all    = 全记（P0/P1 还没有检测能力时用这个，否则等于什么都不记）
  #   hit    = 只记非 pass（被拦、被限速、502 等）—— 上到 block 模式后推荐
  #   sample = 非 pass 全记 + pass 按 access_sample_ratio 采样
  access_mode: all
  access_sample_ratio: 100       # sample 模式下每 100 条 pass 记 1 条

  capture_payload: false         # 默认不落 payload 原文

metrics:
  enabled: true
  addr: "127.0.0.1:9090"

# 控制台与控制面 API
admin:
  enabled: true
  addr: "127.0.0.1:9443"         # 公网暴露时改成 0.0.0.0:9443 并确保防火墙只放你要的口

  # 第一层：HTTP Basic 门槛 —— 挡扫描器，**不是认证边界**
  # 未过 Basic 时，本端口上所有路径统一 401，不区分路径是否存在
  gate:
    enabled: true
    mode: basic                  # basic | none
    realm: "Restricted"          # 中性字符串，别写产品名（那等于自报家门）
    username: gate
    password_hash: ""            # 与登录账号分开；留空则启动时生成并打印
    path_token: ""               # 可选额外遮挡：控制台挂随机路径
    exempt_api_token: true       # 带 X-Donothack-Token 的请求跳过门槛，方便 CLI
    probe_ban_window: 60s
    probe_ban_after: 20
    probe_ban_duration: 15m

  # 门槛用 Basic ⇒ TLS 强制。留空证书时首次启动自动生成自签证书并打印指纹。
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
    auto_self_signed: true

  # 第二层：正式登录
  auth_mode: session             # session | session+basic（后者给 CLI 脚本用）
  username: admin
  password_hash: ""              # 留空则控制台不启动，并打印生成哈希的命令
  api_token: ""                  # CLI 与脚本用，可单独轮换
  totp_enabled: false
  allow_ips: []                  # 可选 IP 白名单，空 = 不限制
  allow_insecure: false          # 绑非本地且未启 TLS 时必须显式设 true 才启动
  session_idle_timeout: 30m
  max_login_fails: 5
  lockout: 15m
  pprof: false                   # 默认关，只在 127.0.0.1 可用

  events:
    retention_days: 7
    retention_bytes: 512MiB
    max_query_range: 24h         # 控制台单次查询最大时间范围
    max_rows: 200
    query_timeout: 3s
    sqlite: false                # 纯 Go SQLite 富查询，medium/small 默认关

alert:
  enabled: false
  webhook: ""

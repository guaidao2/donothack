# 协议违规与畸形请求（请求侧）
#
# 这一组规则只看"请求本身是否合法"，不看参数语义。它们是检测引擎的第一道门，
# 也是误报最容易失控的地方 —— 因此凡是"某个头存在"这类弱信号，一律给低分 + log，
# 只有 NUL 字节、CRLF 注入、chunked 混淆这类"正常流量不可能出现"的形态才给高分。
version: 1
meta:
  name: "协议违规与畸形请求"
  author: "qingli"
  category: protocol

rules:

  # ── 超长输入 ────────────────────────────────────────────────────────
  - id: PROTO-1001
    phase: 1
    severity: medium
    category: protocol
    score: 3
    message: "请求行异常：URI 长度超出 8 KiB 上限"
    tags: [protocol, request-line, oversize]
    targets:
      - collection: REQUEST_URI_LENGTH
    operator:
      name: gt
      params:
        value: 8191
    action:
      type: log
    test:
      positive:
        - "9000"
      negative:
        - "64"
        - "2048"

  - id: PROTO-1002
    phase: 1
    severity: medium
    category: protocol
    score: 3
    message: "请求头异常：单个头部值长度超出 8 KiB"
    tags: [protocol, header, oversize]
    targets:
      - collection: REQUEST_HEADERS
    transforms:
      - length
    operator:
      name: gt
      params:
        value: 8192
    action:
      type: log
    test:
      positive:
        - ""
      negative:
        - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        - "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"

  # ── 畸形字节 ────────────────────────────────────────────────────────
  - id: PROTO-1003
    phase: 2
    severity: high
    category: protocol
    score: 5
    message: "输入中含 NUL 字节（截断绕过特征）"
    tags: [protocol, null-byte, evasion]
    targets:
      - collection: ARGS
      - collection: REQUEST_URI
      - collection: REQUEST_BODY
      - collection: REQUEST_HEADERS
    operator:
      name: validateByteRange
      params:
        range: "1-255"
    test:
      positive:
        - "avatar.png\x00.php"
        - "admin\x00"
      negative:
        - "avatar.png"
        - "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

  # ── CRLF 注入 / 响应头拆分 ──────────────────────────────────────────
  # 变换链刻意不含 urlDecode：编码形态的 %0d%0a 正是要匹配的字面量。
  # 两条 \r\n 之类的短模式只作为补充（它们进不了预筛自动机，但规则被
  # 其它字面量触发时会一并匹配）。
  - id: PROTO-1004
    phase: 2
    severity: high
    category: protocol
    score: 4
    message: "参数或请求行中出现 CRLF 序列（响应头注入 / 请求头拆分特征）"
    tags: [protocol, crlf, header-injection, owasp-a03]
    targets:
      - collection: ARGS
      - collection: REQUEST_URI
      - collection: REQUEST_BODY
    transforms:
      - lowercase
    operator:
      name: pm
      params:
        patterns:
          - "%0d%0a"
          - "%0d%0a%0d%0a"
          - "%0d%0d"
          - "%0a%0d"
          - "%250d%250a"
          - "\r\nset-cookie"
          - "\r\ncontent-length"
          - "\r\nlocation"
          - "\r\nhost"
          - "\\r\\nset-cookie"
          - "\\r\\nlocation"
    test:
      positive:
        - "/account/login%0d%0aSet-Cookie:%20session=x"
        - "%0d%0aContent-Length:%200"
        - "next=%250d%250aLocation:%20http://evil.example/"
        - "x\r\nSet-Cookie: y=1"
      negative:
        - "https://shop.example.com/redirect?next=/account/orders"
        - "Special offer 100%0d off today only"
        - "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

  # ── 方法与头部合法性 ────────────────────────────────────────────────
  - id: PROTO-1005
    phase: 1
    severity: medium
    category: protocol
    score: 4
    message: "请求方法非法或已禁用（不在允许列表内，含 TRACE）"
    tags: [protocol, method, trace, xst]
    targets:
      - collection: REQUEST_METHOD
    transforms:
      - trim
      - uppercase
    operator:
      name: not
      params:
        operator:
          name: regex
          params:
            pattern: "^(?:GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS|CONNECT|PROPFIND|PROPPATCH|MKCOL|COPY|MOVE|LOCK|UNLOCK|REPORT|SEARCH|MERGE|PURGE)$"
    action:
      type: log
    test:
      positive:
        - "FOO"
        - "TRACE"
        - "GETS"
      negative:
        - "GET"
        - "POST"
        - "OPTIONS"

  # ── 请求走私迹象 ────────────────────────────────────────────────────
  # 这一对规则合起来才是"Content-Length 与 Transfer-Encoding 并存"。
  # DSL 目前没有"A 头与 B 头同时存在"的直接表达，只能靠 chain：
  # PROTO-1007 只在 PROTO-1006 命中后评估。分数按 4 + 1 分配，
  # 这样单有 Transfer-Encoding（合法的分块上传）不会被拦，
  # 两者并存才越过阈值 5。加载器若不实现 chain，PROTO-1007 会在每个
  # 带 Content-Length 的请求上 +1 分 —— 只会变吵，不会误拦。
  - id: PROTO-1006
    phase: 1
    severity: medium
    category: protocol
    score: 4
    message: "请求携带 Transfer-Encoding（与 Content-Length 并存即为走私迹象）"
    tags: [protocol, request-smuggling, http-desync]
    targets:
      - collection: REQUEST_HEADERS
        selector: "transfer-encoding"
    transforms:
      - trim
      - lowercase
    operator:
      name: pm
      params:
        patterns:
          - "chunked"
          - "identity"
          - "compress"
    action:
      type: log
    test:
      positive:
        - "chunked"
        - "identity"
      negative:
        - ""
        - "gzip"

  - id: PROTO-1007
    phase: 1
    chain: true
    severity: high
    category: protocol
    score: 1
    message: "请求同时携带 Content-Length 与 Transfer-Encoding（CL.TE / TE.CL 走私）"
    tags: [protocol, request-smuggling, http-desync]
    targets:
      - collection: REQUEST_HEADERS
        selector: "content-length"
    transforms:
      - trim
    operator:
      name: regex
      params:
        pattern: "^[0-9]{1,12}$"
    test:
      positive:
        - "42"
        - "0"
      negative:
        - "chunked"
        - "not-a-number"

  - id: PROTO-1008
    phase: 1
    severity: high
    category: protocol
    score: 4
    message: "Transfer-Encoding 取值异常（重复或混淆的分块声明）"
    tags: [protocol, request-smuggling, http-desync]
    targets:
      - collection: REQUEST_HEADERS
        selector: "transfer-encoding"
    transforms:
      - trim
      - lowercase
    operator:
      name: regex
      params:
        pattern: "chunked[[:space:]]*,|,[[:space:]]*chunked|xchunked|chunked[[:space:]]*;|chunked[[:space:]]+=|\\x0bchunked|^[[:space:]]*chunked[[:space:]]+[0-9]"
    test:
      positive:
        - "chunked, chunked"
        - "xchunked"
        - "chunked;q=1"
      negative:
        - "chunked"
        - "identity"
        - "gzip, deflate"

  # ── Content-Encoding 合法性 ─────────────────────────────────────────
  # 解码器只实现 gzip / deflate / br / zstd / identity。
  # 声明了别的编码意味着"WAF 解不开这段体" —— 属于检测缺口，只记分不拦。
  - id: PROTO-1009
    phase: 1
    severity: low
    category: protocol
    score: 2
    message: "Content-Encoding 声明了解码器不支持的编码（检测盲区）"
    tags: [protocol, content-encoding, bypass]
    targets:
      - collection: REQUEST_HEADERS
        selector: "content-encoding"
    transforms:
      - trim
      - lowercase
    operator:
      name: not
      params:
        operator:
          name: regex
          params:
            pattern: "^(?:gzip|deflate|br|zstd|identity)(?:[[:space:]]*,[[:space:]]*(?:gzip|deflate|br|zstd|identity))*$"
    action:
      type: log
    test:
      positive:
        - "compress"
        - "gzip;q=1.0"
        - "gzip, lzma"
      negative:
        - "gzip"
        - "gzip, deflate"
        - "br"
